# .ai/pipeline.conf — ai-pipeline settings for this repository (sourced as bash).
# Keep the `: "${VAR:=value}"` form: an exported variable of the same name still wins.
# Every setting is optional; the defaults are shown commented out.

# Extra files the agents must never change (build/env scripts the validation relies
# on, CI config, …). .ai/validate.sh, .ai/pipeline.conf, .ai/prompts/*, AGENTS.md,
# CLAUDE.md, GEMINI.md and the toolkit itself are always protected.
AI_PROTECTED_FILES=(
  # tools/build.sh
)

# What the auditor should pay special attention to in this project, one line.
# : "${AI_AUDIT_FOCUS:=thread safety of callbacks; real-time loop timing}"

# Language of the final .ai/summary.md.
# : "${AI_REPORT_LANG:=English}"

# Model tier (normal|hard) and explicit models; see `ai-pipeline --help`.
# : "${AI_TIER:=normal}"
# : "${AI_AGY_MODEL:=gemini-3.8-flash}"
# : "${AI_CODEX_MODEL:=gpt-5.6-sol}"

# agy project id for this folder (found automatically when registered in agy).
# : "${AI_AGY_PROJECT:=}"
